plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	runs {
		client {
			programArgs "--username", "Spore"
			vmArgs "--enable-native-access=ALL-UNNAMED"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Our built-in resource pack's weapon looks (a mod's assets/ folder is loaded like a resource pack
// that's always on): for every weapon in src/main/weapon-models.json, a dummy 16x16 texture and an
// item model, and bread / beetroot / carrot item definitions that pick the model by the item's
// custom_model_data string (set by MycWeapons). A weapon with a hand-made texture in
// src/main/weapon-textures/<key>.png uses it; the rest get a dummy drawn here. Each type has its own
// dummy shape (Slash a blade, Smash a club, Stab a spear), each weapon its own colour.
def weaponResourcesDir = layout.buildDirectory.dir('generated/weapon-resources')
tasks.register('weaponResources') {
	def list = file('src/main/weapon-models.json')
	def handMade = file('src/main/weapon-textures')
	inputs.file list
	inputs.dir(handMade).optional()
	outputs.dir weaponResourcesDir
	doLast {
		def out = weaponResourcesDir.get().asFile
		out.deleteDir()
		def types = new groovy.json.JsonSlurper().parse(list)
		def items = [slash: 'bread', smash: 'beetroot', stab: 'carrot']
		def hueOffset = [slash: 0.0f, smash: 0.33f, stab: 0.66f]
		def write = { String path, Object json ->
			def f = new File(out, path)
			f.parentFile.mkdirs()
			f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
		def slugOf = { String name -> name.toLowerCase(Locale.ROOT).replaceAll(/[^a-z0-9]+/, '_').replaceAll(/^_+|_+$/, '') }
		def draw = { String type, Number hueN ->
			float hue = hueN.floatValue()
			def img = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			int main = java.awt.Color.HSBtoRGB(hue, 0.7f, 0.95f)
			int dark = java.awt.Color.HSBtoRGB(hue, 0.85f, 0.5f)
			int wood = new java.awt.Color(107, 74, 43).getRGB()
			def put = { int x, int y, int c -> if (x >= 0 && x < 16 && y >= 0 && y < 16) img.setRGB(x, y, c) }
			// x + y = 15 runs from the bottom left corner to the top right, as Minecraft's tools do.
			if (type == 'slash') {
				(1..3).each { x -> put(x, 15 - x, wood); put(x, 14 - x, wood) }
				put(2, 11, dark); put(5, 14, dark); put(3, 12, dark); put(4, 13, dark)
				(4..13).each { x -> put(x, 15 - x, main); put(x, 14 - x, main); put(x + 1, 15 - x, dark) }
				put(14, 1, main)
			} else if (type == 'smash') {
				(1..8).each { x -> put(x, 15 - x, wood); put(x, 14 - x, wood) }
				(7..13).each { x -> (2..8).each { y -> put(x, y, (x == 7 || x == 13 || y == 2 || y == 8) ? dark : main) } }
			} else {
				(1..10).each { x -> put(x, 15 - x, wood) }
				(10..14).each { x -> put(x, 15 - x, main); put(x, 14 - x, main) }
				put(9, 4, main); put(10, 3, dark); put(11, 6, main); put(12, 5, dark); put(15, 0, dark)
			}
			img
		}
		def drawn = []
		types.each { type, names ->
			if (!items.containsKey(type)) return
			def cases = []
			names.eachWithIndex { name, i ->
				def slug = slugOf(name)
				def png = new File(out, "assets/myceliumcraft/textures/item/weapon/${slug}.png")
				png.parentFile.mkdirs()
				def own = new File(handMade, "${slug}.png")
				if (own.isFile()) {
					png.bytes = own.bytes
					drawn << "${slug} (hand-made)"
				} else {
					javax.imageio.ImageIO.write(draw(type, (hueOffset[type] + i / (float) names.size()) % 1.0f), 'png', png)
				}
				write("assets/myceliumcraft/models/item/weapon/${slug}.json",
					[parent: 'minecraft:item/handheld', textures: [layer0: "myceliumcraft:item/weapon/${slug}".toString()]])
				cases << [when: slug, model: [type: 'minecraft:model', model: "myceliumcraft:item/weapon/${slug}".toString()]]
			}
			def item = items[type]
			write("assets/minecraft/items/${item}.json", [model: [
				type: 'minecraft:select', property: 'minecraft:custom_model_data', index: 0, cases: cases,
				fallback: [type: 'minecraft:model', model: "minecraft:item/${item}".toString()]]])
		}
		logger.lifecycle("weaponResources: hand-made textures: ${drawn.isEmpty() ? 'none' : drawn.join(', ')}")
	}
}

// Mycelium's stat icons for weapon tooltips (your request, 2026-11-08): cut at build time from
// Mycelium's own icon sheet (2DArt/UI/TextIconSpriteSheet.png in the Mycelium install, only read),
// into build/ and the jar, never into the repository (AGENTS.md rule 1). Which picture is which stat
// is Mycelium's: its tooltips write <sprite=0> Primal, 1 Speed, 2 Sentience, 3 Vitality, the
// indexes of TextIconSpriteSheet.asset's character table, whose names give each picture's rectangle
// in the sheet's .meta (Unity's rectangles start at the bottom left). Each becomes a glyph of the
// font myceliumcraft:stat_icons, U+E000 Primal, U+E001 Sentience, U+E002 Speed, U+E003 Vitality.
// No Mycelium install: no font, and the tooltips keep the stat names (MycWeapons checks).
def statIconsDir = layout.buildDirectory.dir('generated/stat-icons')
def myceliumDir = file(findProperty('myceliumDir') ?: 'C:/Users/Ryan/Documents/ClonedGithubRepos/Mycelium')
tasks.register('statIcons') {
	def sheet = new File(myceliumDir, 'Assets/2DArt/UI/TextIconSpriteSheet.png')
	def meta = new File(myceliumDir, 'Assets/2DArt/UI/TextIconSpriteSheet.png.meta')
	def asset = new File(myceliumDir, 'Assets/2DArt/UI/TextIconSpriteSheet.asset')
	if (sheet.exists() && meta.exists() && asset.exists()) {
		inputs.files sheet, meta, asset
	}
	outputs.dir statIconsDir
	doLast {
		def out = statIconsDir.get().asFile
		out.deleteDir()
		out.mkdirs()
		if (!(sheet.exists() && meta.exists() && asset.exists())) {
			logger.lifecycle("statIcons: no Mycelium icon sheet at ${sheet}; tooltips keep the stat names")
			return
		}
		// Sprite rectangles by name, from the .meta.
		def rects = [:]
		String name = null
		def r = [:]
		meta.eachLine { line ->
			def t = line.trim()
			if (t.startsWith('name: ')) { name = t.substring(6).trim(); r = [:] }
			else if (name != null && t ==~ /(x|y|width|height): -?[0-9.]+/) {
				def (k, v) = t.split(': ')
				r[k] = Math.round(Float.parseFloat(v)) as int
				if (r.size() == 4) { rects[name] = r; name = null }
			}
		}
		// <sprite=N> = the Nth entry of the character table, by name.
		def order = []
		boolean inTable = false
		asset.eachLine { line ->
			def t = line.trim()
			if (t.startsWith('m_SpriteCharacterTable:')) inTable = true
			else if (inTable && t.startsWith('m_SpriteGlyphTable:')) inTable = false
			else if (inTable && t.startsWith('m_Name: ')) order << t.substring(8).trim()
		}
		def image = javax.imageio.ImageIO.read(sheet)
		def stats = [[0, 'primal', '\uE000'], [2, 'sentience', '\uE001'], [1, 'speed', '\uE002'], [3, 'vitality', '\uE003']]
		def providers = []
		def made = []
		stats.each { s ->
			int index = s[0]
			def spriteName = index < order.size() ? order[index] : null
			def rect = spriteName != null ? rects[spriteName] : null
			if (rect == null) { logger.lifecycle("statIcons: no picture for ${s[1]} (<sprite=${index}>)"); return }
			int x = rect.x, w = rect.width, h = rect.height
			int y = image.height - rect.y - h // Unity's rectangles start at the bottom
			def part = image.getSubimage(x, y, w, h)
			int size = 64, side = Math.max(w, h)
			def icon = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			def g = icon.createGraphics()
			g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
			int dw = Math.round(w * size / (float) side), dh = Math.round(h * size / (float) side)
			g.drawImage(part, (int) ((size - dw) / 2), (int) ((size - dh) / 2), dw, dh, null)
			g.dispose()
			def png = new File(out, "assets/myceliumcraft/textures/font/stat_${s[1]}.png")
			png.parentFile.mkdirs()
			javax.imageio.ImageIO.write(icon, 'png', png)
			providers << [type: 'bitmap', file: "myceliumcraft:font/stat_${s[1]}.png".toString(), ascent: 7, height: 8, chars: [s[2]]]
			made << "${s[1]} = ${spriteName} (${w}x${h} at ${x},${y})"
		}
		def font = new File(out, 'assets/myceliumcraft/font/stat_icons.json')
		font.parentFile.mkdirs()
		font.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([providers: providers]))
		logger.lifecycle("statIcons: ${made.size()} of 4 stat icons from Mycelium's sheet: ${made.join(', ')}")
	}
}

processResources {
	from(tasks.named('weaponResources'))
	from(tasks.named('statIcons'))
	// Your two spore skin parts (MycSkins.java colours and combines them while the game runs).
	from(rootProject.file('../dist/skin')) {
		into 'assets/myceliumcraft/textures/spore_skin'
	}
	def version = project.version
	// When this jar was built, logged at start so an old jar in the mods folder is easy to spot.
	def built = new Date().format("yyyy-MM-dd HH:mm")
	inputs.property "version", version
	inputs.property "built", built
	filesMatching("fabric.mod.json") {
		expand "version": version, "built": built
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Stand-in for Mycelium's side of the link, for testing without Unity:
//   gradlew linkTest   (run tools\FakeMycelium first, in another window)
tasks.register('linkTest', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.myceliumcraft.link.LinkTestMain'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Put our jar and the matching Fabric API jar side by side in ../dist/minecraft-mods,
// ready to be copied into a Prism instance's mods folder.
tasks.register('dist', Copy) {
	dependsOn 'build'
	from(layout.buildDirectory.dir('libs')) {
		include "myceliumcraft-${project.version}.jar"
	}
	from(configurations.runtimeClasspath.filter { it.name ==~ /fabric-api-[0-9].*.jar/ && !it.name.contains('-sources') })
	into rootProject.file('../dist/minecraft-mods')
}
